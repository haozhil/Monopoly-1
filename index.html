<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>大富翁</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="hero">
        <div>
          <p class="eyebrow">MONOPOLY / WEB EDITION</p>
          <h1>大富翁</h1>
          <p class="hero-copy">
            掷骰子、买地、收租、抽事件卡。你和 AI 在同一张棋盘上竞争，先把对手拖到破产。
          </p>
        </div>
        <div class="hero-stats">
          <div class="stat-card">
            <span>目标</span>
            <strong>让对手现金归零</strong>
          </div>
          <div class="stat-card">
            <span>模式</span>
            <strong>玩家 vs AI</strong>
          </div>
        </div>
      </section>

      <section class="board-panel">
        <div id="board" class="board" aria-label="游戏棋盘"></div>
      </section>

      <section class="dashboard">
        <div class="panel current-turn">
          <div class="panel-title-row">
            <h2>当前回合</h2>
            <span id="turnBadge" class="turn-badge">玩家</span>
          </div>
          <p id="statusText" class="status-text">点击掷骰子开始游戏。</p>
          <div class="dice-box">
            <span>骰子</span>
            <strong id="diceValue">-</strong>
          </div>
          <div class="actions">
            <button id="rollButton" class="primary-button">掷骰子</button>
            <button id="buyButton" class="secondary-button" disabled>购买地产</button>
            <button id="skipButton" class="ghost-button" disabled>跳过购买</button>
            <button id="restartButton" class="ghost-button">重新开始</button>
          </div>
        </div>

        <div class="panel players-panel">
          <h2>玩家状态</h2>
          <div id="players" class="players"></div>
        </div>

        <div class="panel log-panel">
          <h2>游戏日志</h2>
          <div id="log" class="log" aria-live="polite"></div>
        </div>
      </section>
    </main>

    <template id="tileTemplate">
      <article class="tile">
        <div class="tile-topline">
          <span class="tile-index"></span>
          <span class="tile-type"></span>
        </div>
        <h3 class="tile-name"></h3>
        <p class="tile-meta"></p>
        <div class="tile-footer">
          <span class="owner-chip">未拥有</span>
          <div class="tokens"></div>
        </div>
      </article>
    </template>

    <script src="./script.js"></script>
  </body>
</html>
